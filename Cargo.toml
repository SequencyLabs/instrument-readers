[package]
name = "sequency-instruments"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure-Rust binary instrument file readers for analytical chemistry formats (Shimadzu .lcd, Bruker TopSpin NMR, Agilent OpenLab CDS)."
repository = "https://github.com/SequencyLabs/instrument-readers"
homepage = "https://sequencylabs.com"
readme = "README.md"
keywords = ["chemistry", "chromatography", "nmr", "hplc", "spectroscopy"]
categories = ["science", "parser-implementations"]
exclude = ["python/", ".github/"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"

[dependencies]
crc32fast = "1.5"
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.42", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0.154"
