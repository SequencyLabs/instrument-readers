[workspace]

[package]
name = "sequency-instruments-py"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PyO3 bindings exposing sequency-instruments to Python."
repository = "https://github.com/SequencyLabs/instrument-readers"
publish = false

[lib]
name = "sequency_instruments"
crate-type = ["cdylib"]
test = false
doctest = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
sequency-instruments = { path = ".." }
